<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume &amp; Job Matcher</title>
  <meta name="description" content="Upload a PDF resume to extract skills, predict job roles, and discover top matching job opportunities with skill gap analysis.">
  <meta property="og:title" content="AI Resume &amp; Job Matcher">
  <meta property="og:description" content="Upload a PDF resume to extract skills, predict job roles, and discover top matching job opportunities with skill gap analysis.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            slate: {
              950: '#070a12',
              900: '#0f172a',
              850: '#131e36',
              800: '#1e293b',
              700: '#334155',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Custom Pop-In and Fade-In Animations */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-popIn {
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fadeIn {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom thin scrollbar */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.8);
    }

    body {
      background-color: #070a12;
      color: #f8fafc;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <div id="root">
    <!-- Server/Initial loading fallback -->
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 animate-spin p-[2px]">
        <div class="w-full h-full bg-slate-950 rounded-[10px]"></div>
      </div>
      <p class="mt-4 text-sm font-medium text-slate-400 animate-pulse">Initializing TalentVector AI...</p>
    </div>
  </div>

  <!-- React Bundle Script -->
  <script src="/bundle.js" defer></script>
</body>
</html>
